<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হাই-কোয়ালিটি ইউটিউব MP3 ও প্লেলিস্ট ডাউনলোডার</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between">

    <nav class="bg-gray-900 shadow-md border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl px-4 sm:px-6 lg:px-8 mx-auto">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0">
                    <span class="text-2xl font-bold text-red-500 cursor-pointer">YT<span class="text-green-500">Pro</span></span>
                </div>
                <div class="text-xs sm:text-sm bg-gray-800 text-green-400 font-semibold px-3 py-1 rounded-full border border-green-500/20">
                    🔊 High Quality Audio
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="max-w-2xl w-full bg-gray-900 p-6 sm:p-8 rounded-2xl shadow-2xl border border-gray-800">
            
            <h1 class="text-2xl sm:text-3xl font-bold text-center mb-2">ইউটিউব মিউজিক ডাউনলোডার</h1>
            <p class="text-gray-400 text-xs sm:text-sm text-center mb-6">কোনো ভাঙা উইন্ডো ছাড়া সরাসরি এবং দ্রুত ডাউনলোড করুন</p>

            <div class="flex bg-gray-950 p-1.5 rounded-xl border border-gray-800 mb-6">
                <button id="tab-single" onclick="switchTab('single')" class="flex-1 py-2.5 rounded-lg text-sm font-bold transition bg-red-600 text-white shadow-md">
                    🎵 ১টি গানের লিংক
                </button>
                <button id="tab-playlist" onclick="switchTab('playlist')" class="flex-1 py-2.5 rounded-lg text-sm font-bold transition text-gray-400 hover:text-white">
                    📂 প্লেলিস্ট (Playlist) লিংক
                </button>
            </div>

            <div id="single-section" class="space-y-4">
                <div class="text-left">
                    <label class="block text-xs font-semibold text-gray-400 mb-1.5">ইউটিউব ভিডিওর লিংক দিন:</label>
                    <input type="text" id="single-url" placeholder="https://www.youtube.com/watch?v=..." class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl focus:outline-hidden focus:ring-2 focus:ring-red-500 text-white text-sm placeholder-gray-600">
                </div>
                <button onclick="processSingle()" class="w-full bg-red-600 text-white py-3.5 rounded-xl font-bold hover:bg-red-700 transition shadow-lg shadow-red-600/10 text-sm sm:text-base">
                    🚀 ডাউনলোড লিংক তৈরি করুন
                </button>
            </div>

            <div id="playlist-section" class="space-y-4 hidden">
                <div class="text-left">
                    <label class="block text-xs font-semibold text-gray-400 mb-1.5">ইউটিউব প্লেলিস্টের লিংক দিন:</label>
                    <input type="text" id="playlist-url" placeholder="https://www.youtube.com/playlist?list=..." class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl focus:outline-hidden focus:ring-2 focus:ring-green-500 text-white text-sm placeholder-gray-600">
                </div>
                <button onclick="processPlaylist()" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-bold hover:bg-green-700 transition shadow-lg shadow-green-600/10 text-sm sm:text-base">
                    📂 প্লেলিস্ট ডাউনলোড লিংক তৈরি করুন
                </button>
            </div>

            <div id="result-box" class="mt-8 pt-6 border-t border-gray-800 hidden text-center">
                <div id="display-area">
                    <p class="text-sm text-green-400 font-semibold mb-4">✓ আপনার ডাউনলোড লিংকটি তৈরি হয়েছে!</p>
                    <a id="direct-download-btn" href="#" target="_blank" class="inline-flex items-center justify-center bg-emerald-500 text-gray-950 px-8 py-4 rounded-xl font-black text-lg hover:bg-emerald-400 transition transform hover:scale-105 shadow-xl shadow-emerald-500/20">
                        ⬇️ এখনই MP3 ডাউনলোড করুন
                    </a>
                    <p class="text-xs text-gray-500 mt-3">ক্লিক করার পর নতুন ট্যাবে ডাউনলোডের অপশন চলে আসবে।</p>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-gray-950 text-gray-600 py-4 border-t border-gray-900 text-center text-xs">
        <p>&copy; ২০২৬ YTPro মিউজিক গেটওয়ে।</p>
    </footer>

    <script>
        let currentMode = "single";

        function switchTab(mode) {
            currentMode = mode;
            const tabSingle = document.getElementById('tab-single');
            const tabPlaylist = document.getElementById('tab-playlist');
            const singleSection = document.getElementById('single-section');
            const playlistSection = document.getElementById('playlist-section');
            document.getElementById('result-box').classList.add('hidden');

            if (mode === 'single') {
                tabSingle.className = "flex-1 py-2.5 rounded-lg text-sm font-bold transition bg-red-600 text-white shadow-md";
                tabPlaylist.className = "flex-1 py-2.5 rounded-lg text-sm font-bold transition text-gray-400 hover:text-white";
                singleSection.classList.remove('hidden');
                playlistSection.classList.add('hidden');
            } else {
                tabSingle.className = "flex-1 py-2.5 rounded-lg text-sm font-bold transition text-gray-400 hover:text-white";
                tabPlaylist.className = "flex-1 py-2.5 rounded-lg text-sm font-bold transition bg-green-600 text-white shadow-md";
                singleSection.classList.add('hidden');
                playlistSection.classList.remove('hidden');
            }
        }

        // ১) সিঙ্গেল গান ডাউনলোডের নতুন ডিরেক্ট মেথড
        function processSingle() {
            const url = document.getElementById('single-url').value.trim();
            if (!url) return alert('দয়া করে ইউটিউব গানের লিংকটি দিন!');

            let videoId = "";
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);

            if (match && match[2].length == 11) {
                videoId = match[2];
                
                // এবার আমরা কোনো ফাটল ফ্রেম লোড করবো না, সরাসরি ওয়ার্ল্ড-পপুলার ডিরেক্ট কনভার্টার লিংকে পাঠিয়ে দেবো
                const directUrl = `https://9xbuddy.org/process?url=https://www.youtube.com/watch?v=${videoId}`;
                
                document.getElementById('result-box').classList.remove('hidden');
                const btn = document.getElementById('direct-download-btn');
                btn.href = directUrl;
                btn.className = "inline-flex items-center justify-center bg-red-600 text-white px-8 py-4 rounded-xl font-black text-lg hover:bg-red-500 transition transform hover:scale-105 shadow-xl";
            } else {
                alert('ভুল লিংক! দয়া করে সঠিক ইউটিউব লিংক দিন।');
            }
        }

        // ২) প্লেলিস্ট ডাউনলোডের নতুন ডিরেক্ট মেথড
        function processPlaylist() {
            const url = document.getElementById('playlist-url').value.trim();
            if (!url) return alert('দয়া করে ইউটিউব প্লেলিস্টের লিংকটি দিন!');

            let playlistId = "";
            if (url.includes('list=')) {
                playlistId = url.split('list=')[1].split('&')[0];
            }

            if (playlistId) {
                // প্লেলিস্টের জন্য সরাসরি হাই-স্পিড মাল্টিপল ডাউনলোডার গেটওয়ে
                const directPlaylistUrl = `https://9xbuddy.org/process?url=https://www.youtube.com/playlist?list=${playlistId}`;
                
                document.getElementById('result-box').classList.remove('hidden');
                const btn = document.getElementById('direct-download-btn');
                btn.href = directPlaylistUrl;
                btn.className = "inline-flex items-center justify-center bg-green-600 text-white px-8 py-4 rounded-xl font-black text-lg hover:bg-green-500 transition transform hover:scale-105 shadow-xl";
            } else {
                alert('সঠিকে প্লেলিস্ট লিংক খুঁজে পাওয়া যায়নি!');
            }
        }
    </script>
</body>
</html>
